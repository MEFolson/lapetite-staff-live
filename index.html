<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#073f35"><title>LaPetite Staff</title><style>body{margin:0;font-family:Segoe UI,sans-serif;background:#073f35;color:#1c2321}.card{max-width:460px;margin:28px auto;background:#fff;border-radius:18px;padding:24px}h1{color:#073f35;font-size:1.35rem;margin:0 0 6px}button,input,select,textarea{font:inherit}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #c5ddd7;border-radius:8px;margin:4px 0 12px}button{background:#0b5d4e;color:#fff;border:0;border-radius:8px;padding:12px;font-weight:600}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #eee}.nav button{width:auto;margin:8px 6px 0 0;background:#e7f3f0;color:#073f35}.hide{display:none}.note{background:#f6eedc;padding:10px;border-radius:8px;font-size:.9rem}</style></head><body><div id="login" class="card"><h1>LaPetite Chemists Ltd</h1><p>Ahodwo, Kumasi · staff register</p><label>Access code</label><input id="pin" type="password" autocomplete="current-password"><p id="err" style="color:#9b2c2c"></p><button onclick="go()">Open register</button><p class="note">Access code: <b>Ahodwo2026</b>. Records stay on this phone or computer.</p></div><div id="app" class="card hide"><h1>Staff overview</h1><div class="nav"><button onclick="show('list')">Directory</button><button onclick="show('form')">Add employee</button><button onclick="out()">Sign out</button></div><p id="count"></p><div id="list"></div><form id="form" class="hide" onsubmit="save(event)"><input name="firstName" placeholder="First name" required><input name="lastName" placeholder="Last name" required><input name="jobTitle" placeholder="Job title"><input name="phone" placeholder="Telephone"><input name="ghanaCard" placeholder="Ghana Card"><button>Save record</button></form></div><script>const K='lapetite.staff.v1',P='Ahodwo2026';let people=JSON.parse(localStorage.getItem(K)||'[]');function go(){if(document.getElementById('pin').value.trim()!==P){document.getElementById('err').textContent='Incorrect access code.';return}sessionStorage.setItem('ok','1');document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');draw()}function out(){sessionStorage.removeItem('ok');location.reload()}function show(n){document.getElementById('form').classList.toggle('hide',n!=='form');document.getElementById('list').classList.toggle('hide',n!=='list')}function draw(){document.getElementById('count').textContent=people.length+' employees on file';document.getElementById('list').innerHTML=people.length?'<table><tr><th>Name</th><th>Role</th><th>Telephone</th></tr>'+people.map(p=>'<tr><td>'+p.firstName+' '+p.lastName+'</td><td>'+(p.jobTitle||'')+'</td><td>'+(p.phone||'')+'</td></tr>').join('')+'</table>':'<p>No records yet. Use Add employee.</p>'}function save(e){e.preventDefault();people.push(Object.fromEntries(new FormData(e.target)));localStorage.setItem(K,JSON.stringify(people));e.target.reset();show('list');draw()}if(sessionStorage.getItem('ok'))go();</script></body></html>
